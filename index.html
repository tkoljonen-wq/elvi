<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Elvi — litterointikokeilu</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --text: #f1f5f9;
      --muted: #64748b;
      --accent: #38bdf8;
      --accent-dark: #0284c7;
      --danger: #ef4444;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* --- Yläpalkki --- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid #334155;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    .status {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: #334155;
      color: var(--muted);
      white-space: nowrap;
    }
    .status.listening { background: rgba(34,197,94,0.15); color: var(--ok); }
    .status.error { background: rgba(239,68,68,0.15); color: var(--danger); }
    .link-btn {
      background: none; border: none; color: var(--accent);
      font-size: 0.8rem; cursor: pointer; padding: 0.25rem;
    }

    /* --- Tekstialue --- */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      -webkit-overflow-scrolling: touch;
    }
    .final {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      line-height: 1.35;
      margin: 0 0 0.5rem 0;
    }
    .final p { margin: 0 0 0.6rem 0; }
    .interim {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      line-height: 1.35;
      opacity: 0.5;
      font-style: italic;
      margin: 0;
    }
    .placeholder {
      color: var(--muted);
      font-size: 1.1rem;
      font-style: italic;
    }

    /* --- Painikkeet --- */
    .controls {
      display: flex;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--panel);
      border-top: 1px solid #334155;
    }
    .controls button {
      flex: 1;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 1rem 0.5rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      color: #fff;
      transition: filter 0.15s;
    }
    .controls button:active { filter: brightness(0.85); }
    .controls button:disabled { opacity: 0.4; }
    #startBtn { background: var(--ok); }
    #stopBtn { background: var(--danger); }
    #clearBtn { background: #475569; }

    /* --- Asetusnäkymä --- */
    .setup {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem;
      gap: 1rem;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }
    .setup h2 { margin: 0; font-size: 1.4rem; }
    .setup p { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .setup label { font-size: 0.9rem; color: var(--text); display: block; margin-bottom: 0.35rem; }
    .setup input {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      border-radius: 0.6rem;
      border: 1px solid #475569;
      background: #0b1220;
      color: var(--text);
    }
    .setup button {
      padding: 1rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      background: var(--accent-dark);
      color: #fff;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ============ ASETUSNÄKYMÄ (näkyy jos avainta ei ole) ============ -->
  <section id="setupView" class="setup hidden">
    <h2>Azure-asetukset</h2>
    <p>
      Liitä Azure Speech -resurssin <strong>avain</strong> ja <strong>alue</strong>.
      Löydät ne Azure Portalista kohdasta <em>Keys and Endpoint</em>.
      Tiedot tallentuvat vain tähän selaimeen — niitä ei lähetetä mihinkään.
    </p>
    <div>
      <label for="keyInput">Avain (KEY 1)</label>
      <input id="keyInput" type="password" autocomplete="off" placeholder="esim. 3f9a...">
    </div>
    <div>
      <label for="regionInput">Alue (Region)</label>
      <input id="regionInput" type="text" autocomplete="off" value="westeurope" placeholder="westeurope">
    </div>
    <button id="saveSettingsBtn">Tallenna ja jatka</button>
  </section>

  <!-- ============ PÄÄNÄKYMÄ ============ -->
  <header id="appHeader" class="hidden">
    <h1>Elvi · litterointikokeilu</h1>
    <span id="status" class="status">valmis</span>
    <button id="settingsBtn" class="link-btn">Asetukset</button>
  </header>

  <main id="appMain" class="hidden">
    <div id="finalText" class="final"></div>
    <p id="interimText" class="interim"></p>
    <p id="placeholder" class="placeholder">Paina "Aloita" ja ala puhua. Teksti ilmestyy tähän.</p>
  </main>

  <div id="controls" class="controls hidden">
    <button id="startBtn">▶ Aloita</button>
    <button id="stopBtn" disabled>■ Lopeta</button>
    <button id="clearBtn">Tyhjennä</button>
  </div>

  <!-- Azure Speech SDK selainversio -->
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
  <script>
    // ====================== TILA & ELEMENTIT ======================
    const el = (id) => document.getElementById(id);
    const setupView = el('setupView');
    const appHeader = el('appHeader');
    const appMain = el('appMain');
    const controls = el('controls');
    const statusEl = el('status');
    const finalEl = el('finalText');
    const interimEl = el('interimText');
    const placeholderEl = el('placeholder');
    const startBtn = el('startBtn');
    const stopBtn = el('stopBtn');
    const clearBtn = el('clearBtn');

    let recognizer = null;
    let listening = false;

    // ====================== ASETUSTEN HALLINTA ======================
    function getSettings() {
      const key = localStorage.getItem('elvi_azure_key');
      const region = localStorage.getItem('elvi_azure_region');
      return key && region ? { key, region } : null;
    }

    function showSetup() {
      setupView.classList.remove('hidden');
      appHeader.classList.add('hidden');
      appMain.classList.add('hidden');
      controls.classList.add('hidden');
      const s = getSettings();
      if (s) { el('keyInput').value = s.key; el('regionInput').value = s.region; }
    }

    function showApp() {
      setupView.classList.add('hidden');
      appHeader.classList.remove('hidden');
      appMain.classList.remove('hidden');
      controls.classList.remove('hidden');
    }

    el('saveSettingsBtn').addEventListener('click', () => {
      const key = el('keyInput').value.trim();
      const region = el('regionInput').value.trim().toLowerCase();
      if (!key || !region) { alert('Anna sekä avain että alue.'); return; }
      localStorage.setItem('elvi_azure_key', key);
      localStorage.setItem('elvi_azure_region', region);
      showApp();
    });

    el('settingsBtn').addEventListener('click', () => {
      if (listening) stopRecognition();
      showSetup();
    });

    // ====================== TILAN NÄYTTÖ ======================
    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (cls ? ' ' + cls : '');
    }

    function showError(title, err) {
      let box = document.getElementById('errorBox');
      if (!box) {
        box = document.createElement('div');
        box.id = 'errorBox';
        box.style.cssText = 'background:rgba(239,68,68,0.15);color:#fca5a5;' +
          'border:1px solid #ef4444;border-radius:0.6rem;padding:0.9rem;' +
          'margin-bottom:1rem;font-size:0.95rem;white-space:pre-wrap;word-break:break-word;';
        appMain.insertBefore(box, appMain.firstChild);
      }
      let detail = '';
      if (typeof err === 'string') detail = err;
      else if (err && err.message) detail = err.message;
      else if (err) { try { detail = JSON.stringify(err); } catch (e) { detail = String(err); } }
      box.textContent = '⚠ ' + title + (detail ? '\n' + detail : '');
    }

    function clearError() {
      const box = document.getElementById('errorBox');
      if (box) box.remove();
    }

    // ====================== TEKSTIN NÄYTTÖ ======================
    function appendFinal(text) {
      if (!text.trim()) return;
      placeholderEl.classList.add('hidden');
      const p = document.createElement('p');
      p.textContent = text.trim();
      finalEl.appendChild(p);
      interimEl.textContent = '';
      appMain.scrollTop = appMain.scrollHeight;
    }

    function setInterim(text) {
      if (text.trim()) placeholderEl.classList.add('hidden');
      interimEl.textContent = text;
      appMain.scrollTop = appMain.scrollHeight;
    }

    function clearText() {
      finalEl.innerHTML = '';
      interimEl.textContent = '';
      placeholderEl.classList.remove('hidden');
    }

    // ====================== PUHEENTUNNISTUS (Azure) ======================
    function startRecognition() {
      const s = getSettings();
      if (!s) { showSetup(); return; }
      if (!window.SpeechSDK) {
        setStatus('SDK ei latautunut — tarkista nettiyhteys', 'error');
        return;
      }

      try {
        const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(s.key, s.region);
        speechConfig.speechRecognitionLanguage = 'fi-FI';
        const audioConfig = SpeechSDK.AudioConfig.fromDefaultMicrophoneInput();
        recognizer = new SpeechSDK.SpeechRecognizer(speechConfig, audioConfig);

        // keskeneräinen tunnistus (himmeä kursiivi)
        recognizer.recognizing = (sender, e) => {
          setInterim(e.result.text);
        };

        // valmis lause
        recognizer.recognized = (sender, e) => {
          if (e.result.reason === SpeechSDK.ResultReason.RecognizedSpeech) {
            appendFinal(e.result.text);
          }
        };

        // virhe / katkaisu
        recognizer.canceled = (sender, e) => {
          if (e.reason === SpeechSDK.CancellationReason.Error) {
            setStatus('virhe', 'error');
            showError('Azure katkaisi yhteyden (koodi ' + e.errorCode + ')', e.errorDetails || 'ei lisätietoa');
            console.error('Azure canceled:', e.errorCode, e.errorDetails);
          }
          listening = false;
          startBtn.disabled = false;
          stopBtn.disabled = true;
        };

        recognizer.sessionStopped = () => {
          listening = false;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          if (statusEl.className.indexOf('error') === -1) setStatus('pysäytetty');
        };

        clearError();
        setStatus('käynnistetään…');
        recognizer.startContinuousRecognitionAsync(
          () => {
            listening = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            setStatus('● kuuntelee', 'listening');
          },
          (err) => {
            setStatus('Käynnistys epäonnistui', 'error');
            showError('Käynnistys epäonnistui', err);
            console.error(err);
          }
        );
      } catch (err) {
        setStatus('Virhe käynnistyksessä', 'error');
        showError('Virhe käynnistyksessä', err);
        console.error(err);
      }
    }

    function stopRecognition() {
      if (!recognizer) return;
      recognizer.stopContinuousRecognitionAsync(
        () => {
          recognizer.close();
          recognizer = null;
          listening = false;
          startBtn.disabled = false;
          stopBtn.disabled = true;
          setStatus('pysäytetty');
        },
        (err) => { console.error(err); }
      );
    }

    startBtn.addEventListener('click', startRecognition);
    stopBtn.addEventListener('click', stopRecognition);
    clearBtn.addEventListener('click', clearText);

    // ====================== KÄYNNISTYS ======================
    if (getSettings()) { showApp(); } else { showSetup(); }
  </script>
</body>
</html>
